<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>BuggPad — Owner settings</title><link rel="stylesheet" href="/style.css"><script type="module" src="/admin.js"></script></head>
<body><header class="topbar"><a class="brand" href="/">⌁ Bugg<span>Pad</span><small>OWNER SETTINGS</small></a><a class="launch" href="/">Return to battlefield ↗</a></header>
<main class="owner-main"><section class="panel owner-panel"><div class="panel-heading"><span>OWNER SETTINGS</span><span class="tag">PRIVATE EDITING</span></div><div class="owner-content"><h1>Set your token</h1><p>This is the token everyone will see in the battlefield.</p><form id="owner-form"><label for="owner-mint">Pump.fun contract address</label><input id="owner-mint" placeholder="Paste CA or Pump.fun token URL" autocomplete="off" spellcheck="false" required disabled><div class="owner-actions"><button class="primary" id="owner-save" type="submit" disabled>Save token</button><button class="quiet" id="owner-clear" type="button" disabled>Use demo until launch</button></div><p id="owner-status" role="status" aria-live="polite">Loading your settings…</p></form><p class="muted">Changes apply to all viewers. Only your signed-in owner account can save them.</p><a href="/signout-with-chatgpt?return_to=%2F" target="_top">Sign out</a></div></section></main></body></html>
